spring:
  application:
    name: service-registry
  datasource:
    url: jdbc:mariadb://172.168.10.101:3306/microsvs
    username: golden
    password: golden
    driver-class-name: org.mariadb.jdbc.Driver
    jpa:
      hibernate:
        ddl-auto: update
      properties:
      show-sql: true
server:
  port: 8761

eureka:
  instance:
    preferIpAddress: true
  client:
    register-with-eureka: false
    fetch-registry: false
  serviceUrl:
    defaultZone: http://${eureka.instance.hostname}:${server.port}/eureka/